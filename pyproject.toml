[project]
name = "value-forcing"
version = "0.0.0"
description = "Value Forcing: Aligning Return Distributions at All Noise Levels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "jax[cuda12]==0.6.2",
    "flax==0.10.7",
    "optax==0.2.8",
    "ml_collections==1.0.0",
    "numpy==1.26.4",
    "ogbench==1.1.4",
    "ocbench[mjwarp]==1.0.1",
    "gymnasium==1.2.0",
    # Keep the simulator stack compatible across OGBench and OCBench MJWarp evaluation.
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.14.0",
    "dm_control==1.0.44",
    "wandb==0.19.3",
    "absl-py==2.2.2",
    "tqdm==4.67.1",
    "pillow==10.4.0",
    "moviepy==1.0.3",  # Evaluation videos (--video_episodes > 0).
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "single"
